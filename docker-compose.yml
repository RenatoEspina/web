services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.24.0}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./adapters:/adapters:ro
    devices:
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    runtime: nvidia
    cpuset: "0-11"
    ipc: host
    command:
      # Perfil conservador para una RTX 3060 Laptop con 6 GB de VRAM.
      # Se puede sobrescribir al ejecutar: VLLM_MODEL=... docker compose up -d vllm
      - ${VLLM_MODEL:-Qwen/Qwen3.5-0.8B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - float16
      # La interfaz solo usa texto; no cargamos el encoder visual.
      - --language-model-only
      # Qwen3.5-0.8B es no-thinking por defecto; lo fijamos para no consumir
      # el límite de salida con razonamiento oculto.
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.80}"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-4096}"
      # Una sola solicitud evita que varias peticiones agoten la VRAM.
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-1}"
      - --max-num-batched-tokens
      - "${VLLM_MAX_NUM_BATCHED_TOKENS:-2048}"
      - --enforce-eager
      # Reutiliza el prefijo documental estable del modo CAG.
      - --enable-prefix-caching
      - --enable-lora
      - --max-loras
      - "${VLLM_MAX_LORAS:-2}"
      - --max-lora-rank
      - "${VLLM_MAX_LORA_RANK:-32}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 180
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    cpuset: "0-11"
    environment:
      # Fuerza Ollama a ejecutarse en CPU
      OLLAMA_LLM_LIBRARY: "cpu"
      OLLAMA_VULKAN: "false"
      CUDA_VISIBLE_DEVICES: "-1"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  ollama-data:
  hf-cache:
