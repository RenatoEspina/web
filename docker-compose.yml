services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.24.0}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    devices:
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    runtime: nvidia
    cpuset: "0-11"
    ipc: host
    command:
      - meta-llama/Llama-3.2-1B-Instruct
      - --gpu-memory-utilization
      - "0.70"
      - --max-model-len
      - "2048"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 180
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    devices:
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    runtime: nvidia
    cpuset: "0-11"
    environment:
      OLLAMA_VULKAN: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  ollama-data:
  hf-cache:
