name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify fine-tuning dependency resolution
        run: python -m pip install --dry-run -r trainer/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      # Materializa el corpus Dolly para que sus tests de integración corran de
      # verdad. Si Hugging Face no responde, el paso se salta y los tests
      # marcados con skipUnless se saltan solos: no se convierte en un fallo de
      # CI por una caída ajena al repositorio.
      - name: Build the Dolly control corpus (best effort)
        continue-on-error: true
        run: python trainer/corpora/dolly/build.py

      - name: Verify
        run: npm run verify
